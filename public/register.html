<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - GameHub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    body {
      background: linear-gradient(180deg, #1b2838 0%, #0e1621 100%);
      min-height: 100vh;
    }
    .checkbox-container {
      max-height: 200px;
      overflow-y: auto;
    }
    .checkbox-container::-webkit-scrollbar {
      width: 8px;
    }
    .checkbox-container::-webkit-scrollbar-track {
      background: #16202d;
      border-radius: 4px;
    }
    .checkbox-container::-webkit-scrollbar-thumb {
      background: #2a475e;
      border-radius: 4px;
    }
    .checkbox-container::-webkit-scrollbar-thumb:hover {
      background: #66c0f4;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-2xl">
    <div class="text-center mb-8">
      <h1 class="text-4xl font-bold text-[#66c0f4] mb-2 flex items-center justify-center">
        <i class="fas fa-gamepad mr-3"></i>GameHub
      </h1>
      <p class="text-[#8f98a0]">Create your account to get started</p>
    </div>
    
    <div class="bg-[#1b2838] rounded-lg p-8 shadow-2xl border border-[#2a475e]">
      <h2 class="text-2xl font-bold text-[#c7d5e0] mb-6">Create Account</h2>
      <form id="register-form" class="space-y-6">
        <div>
          <label for="username" class="block text-[#c7d5e0] text-sm font-medium mb-2">
            <i class="fas fa-user mr-2 text-[#66c0f4]"></i>Username
          </label>
          <input type="text" id="username" name="username" required
                 placeholder="Choose a username"
                 class="w-full px-4 py-3 bg-[#16202d] border border-[#2a475e] rounded-lg text-[#c7d5e0] placeholder-[#8f98a0] focus:outline-none focus:ring-2 focus:ring-[#66c0f4] focus:border-[#66c0f4] transition-all">
        </div>
        <div>
          <label for="password" class="block text-[#c7d5e0] text-sm font-medium mb-2">
            <i class="fas fa-lock mr-2 text-[#66c0f4]"></i>Password
          </label>
          <input type="password" id="password" name="password" required
                 placeholder="Create a password"
                 class="w-full px-4 py-3 bg-[#16202d] border border-[#2a475e] rounded-lg text-[#c7d5e0] placeholder-[#8f98a0] focus:outline-none focus:ring-2 focus:ring-[#66c0f4] focus:border-[#66c0f4] transition-all">
        </div>
        <div>
          <label class="block text-[#c7d5e0] text-sm font-medium mb-2">
            <i class="fas fa-tags mr-2 text-[#66c0f4]"></i>Preferred Genres
            <span class="text-[#b84040] ml-2">*Select at least one</span>
          </label>
          <div class="checkbox-container grid grid-cols-2 md:grid-cols-3 gap-3 p-4 bg-[#16202d] border border-[#2a475e] rounded-lg">
            <label class="flex items-center text-[#c7d5e0] hover:text-[#66c0f4] cursor-pointer transition-colors">
              <input type="checkbox" name="genres" value="RPG" class="mr-2 w-4 h-4 text-[#66c0f4] bg-[#16202d] border-[#2a475e] rounded focus:ring-[#66c0f4]">
              RPG
            </label>
            <label class="flex items-center text-[#c7d5e0] hover:text-[#66c0f4] cursor-pointer transition-colors">
              <input type="checkbox" name="genres" value="Action" class="mr-2 w-4 h-4 text-[#66c0f4] bg-[#16202d] border-[#2a475e] rounded focus:ring-[#66c0f4]">
              Action
            </label>
            <label class="flex items-center text-[#c7d5e0] hover:text-[#66c0f4] cursor-pointer transition-colors">
              <input type="checkbox" name="genres" value="Adventure" class="mr-2 w-4 h-4 text-[#66c0f4] bg-[#16202d] border-[#2a475e] rounded focus:ring-[#66c0f4]">
              Adventure
            </label>
            <label class="flex items-center text-[#c7d5e0] hover:text-[#66c0f4] cursor-pointer transition-colors">
              <input type="checkbox" name="genres" value="Strategy" class="mr-2 w-4 h-4 text-[#66c0f4] bg-[#16202d] border-[#2a475e] rounded focus:ring-[#66c0f4]">
              Strategy
            </label>
            <label class="flex items-center text-[#c7d5e0] hover:text-[#66c0f4] cursor-pointer transition-colors">
              <input type="checkbox" name="genres" value="Sandbox" class="mr-2 w-4 h-4 text-[#66c0f4] bg-[#16202d] border-[#2a475e] rounded focus:ring-[#66c0f4]">
              Sandbox
            </label>
            <label class="flex items-center text-[#c7d5e0] hover:text-[#66c0f4] cursor-pointer transition-colors">
              <input type="checkbox" name="genres" value="Sports" class="mr-2 w-4 h-4 text-[#66c0f4] bg-[#16202d] border-[#2a475e] rounded focus:ring-[#66c0f4]">
              Sports
            </label>
            <label class="flex items-center text-[#c7d5e0] hover:text-[#66c0f4] cursor-pointer transition-colors">
              <input type="checkbox" name="genres" value="Simulation" class="mr-2 w-4 h-4 text-[#66c0f4] bg-[#16202d] border-[#2a475e] rounded focus:ring-[#66c0f4]">
              Simulation
            </label>
            <label class="flex items-center text-[#c7d5e0] hover:text-[#66c0f4] cursor-pointer transition-colors">
              <input type="checkbox" name="genres" value="Party" class="mr-2 w-4 h-4 text-[#66c0f4] bg-[#16202d] border-[#2a475e] rounded focus:ring-[#66c0f4]">
              Party
            </label>
            <label class="flex items-center text-[#c7d5e0] hover:text-[#66c0f4] cursor-pointer transition-colors">
              <input type="checkbox" name="genres" value="Shooter" class="mr-2 w-4 h-4 text-[#66c0f4] bg-[#16202d] border-[#2a475e] rounded focus:ring-[#66c0f4]">
              Shooter
            </label>
            <label class="flex items-center text-[#c7d5e0] hover:text-[#66c0f4] cursor-pointer transition-colors">
              <input type="checkbox" name="genres" value="MMO" class="mr-2 w-4 h-4 text-[#66c0f4] bg-[#16202d] border-[#2a475e] rounded focus:ring-[#66c0f4]">
              MMO
            </label>
            <label class="flex items-center text-[#c7d5e0] hover:text-[#66c0f4] cursor-pointer transition-colors">
              <input type="checkbox" name="genres" value="FPS" class="mr-2 w-4 h-4 text-[#66c0f4] bg-[#16202d] border-[#2a475e] rounded focus:ring-[#66c0f4]">
              FPS
            </label>
            <label class="flex items-center text-[#c7d5e0] hover:text-[#66c0f4] cursor-pointer transition-colors">
              <input type="checkbox" name="genres" value="Battle Royale" class="mr-2 w-4 h-4 text-[#66c0f4] bg-[#16202d] border-[#2a475e] rounded focus:ring-[#66c0f4]">
              Battle Royale
            </label>
            <label class="flex items-center text-[#c7d5e0] hover:text-[#66c0f4] cursor-pointer transition-colors">
              <input type="checkbox" name="genres" value="Survival" class="mr-2 w-4 h-4 text-[#66c0f4] bg-[#16202d] border-[#2a475e] rounded focus:ring-[#66c0f4]">
              Survival
            </label>
            <label class="flex items-center text-[#c7d5e0] hover:text-[#66c0f4] cursor-pointer transition-colors">
              <input type="checkbox" name="genres" value="Horror" class="mr-2 w-4 h-4 text-[#66c0f4] bg-[#16202d] border-[#2a475e] rounded focus:ring-[#66c0f4]">
              Horror
            </label>
            <label class="flex items-center text-[#c7d5e0] hover:text-[#66c0f4] cursor-pointer transition-colors">
              <input type="checkbox" name="genres" value="Co-op" class="mr-2 w-4 h-4 text-[#66c0f4] bg-[#16202d] border-[#2a475e] rounded focus:ring-[#66c0f4]">
              Co-op
            </label>
            <label class="flex items-center text-[#c7d5e0] hover:text-[#66c0f4] cursor-pointer transition-colors">
              <input type="checkbox" name="genres" value="Puzzle" class="mr-2 w-4 h-4 text-[#66c0f4] bg-[#16202d] border-[#2a475e] rounded focus:ring-[#66c0f4]">
              Puzzle
            </label>
            <label class="flex items-center text-[#c7d5e0] hover:text-[#66c0f4] cursor-pointer transition-colors">
              <input type="checkbox" name="genres" value="Racing" class="mr-2 w-4 h-4 text-[#66c0f4] bg-[#16202d] border-[#2a475e] rounded focus:ring-[#66c0f4]">
              Racing
            </label>
          </div>
        </div>
        <div>
          <label class="block text-[#c7d5e0] text-sm font-medium mb-2">
            <i class="fas fa-users mr-2 text-[#66c0f4]"></i>Preferred Modes
            <span class="text-[#b84040] ml-2">*Select at least one</span>
          </label>
          <div class="grid grid-cols-2 md:grid-cols-3 gap-3 p-4 bg-[#16202d] border border-[#2a475e] rounded-lg">
            <label class="flex items-center text-[#c7d5e0] hover:text-[#66c0f4] cursor-pointer transition-colors">
              <input type="checkbox" name="modes" value="Single-player" class="mr-2 w-4 h-4 text-[#66c0f4] bg-[#16202d] border-[#2a475e] rounded focus:ring-[#66c0f4]">
              Single-player
            </label>
            <label class="flex items-center text-[#c7d5e0] hover:text-[#66c0f4] cursor-pointer transition-colors">
              <input type="checkbox" name="modes" value="Multiplayer" class="mr-2 w-4 h-4 text-[#66c0f4] bg-[#16202d] border-[#2a475e] rounded focus:ring-[#66c0f4]">
              Multiplayer
            </label>
            <label class="flex items-center text-[#c7d5e0] hover:text-[#66c0f4] cursor-pointer transition-colors">
              <input type="checkbox" name="modes" value="Online" class="mr-2 w-4 h-4 text-[#66c0f4] bg-[#16202d] border-[#2a475e] rounded focus:ring-[#66c0f4]">
              Online
            </label>
            <label class="flex items-center text-[#c7d5e0] hover:text-[#66c0f4] cursor-pointer transition-colors">
              <input type="checkbox" name="modes" value="Co-op" class="mr-2 w-4 h-4 text-[#66c0f4] bg-[#16202d] border-[#2a475e] rounded focus:ring-[#66c0f4]">
              Co-op
            </label>
          </div>
        </div>
        <div id="error-message" class="hidden bg-[#b84040] bg-opacity-20 border border-[#b84040] text-[#ff6b6b] px-4 py-3 rounded-lg text-sm"></div>
        <button type="submit"
                class="w-full bg-[#5c7e10] hover:bg-[#6e8f1a] text-white py-3 px-4 rounded-lg font-bold transition-colors flex items-center justify-center">
          <i class="fas fa-user-plus mr-2"></i>
          Create Account
        </button>
      </form>
      <div class="mt-6 pt-6 border-t border-[#2a475e]">
        <p class="text-[#8f98a0] text-center text-sm">
          Already have an account? 
          <a href="login.html" class="text-[#66c0f4] hover:text-[#8cd4f4] font-semibold underline">Sign in here</a>
        </p>
      </div>
    </div>
    
    <div class="mt-8 mb-4 text-center">
      <a href="index.html" class="text-[#66c0f4] hover:text-[#8cd4f4] text-sm inline-flex items-center">
        <i class="fas fa-arrow-left mr-2"></i>Back to Store
      </a>
    </div>
  </div>
  <script src="js/UserForm.js"></script>
</body>
</html>
