<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Game Recommendation System</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-900 via-purple-900 to-indigo-900 min-h-screen flex items-center justify-center">
  <div class="bg-white bg-opacity-10 backdrop-blur-lg rounded-2xl p-8 shadow-2xl w-full max-w-lg">
    <h1 class="text-3xl font-bold text-white text-center mb-8">Create Your Account</h1>
    <form id="register-form" class="space-y-6">
      <div>
        <label for="username" class="block text-white text-sm font-medium mb-2">Username:</label>
        <input type="text" id="username" name="username" required
               class="w-full px-4 py-3 bg-white bg-opacity-20 border border-white border-opacity-30 rounded-lg text-white placeholder-white placeholder-opacity-70 focus:outline-none focus:ring-2 focus:ring-white focus:border-transparent">
      </div>
      <div>
        <label for="password" class="block text-white text-sm font-medium mb-2">Password:</label>
        <input type="password" id="password" name="password" required
               class="w-full px-4 py-3 bg-white bg-opacity-20 border border-white border-opacity-30 rounded-lg text-white placeholder-white placeholder-opacity-70 focus:outline-none focus:ring-2 focus:ring-white focus:border-transparent">
      </div>
      <div>
        <label class="block text-white text-sm font-medium mb-2">Preferred Genres:</label>
        <div class="grid grid-cols-2 gap-2">
          <label class="flex items-center text-white">
            <input type="checkbox" name="genres" value="RPG" class="mr-2 accent-pink-500">
            RPG
          </label>
          <label class="flex items-center text-white">
            <input type="checkbox" name="genres" value="Action" class="mr-2 accent-pink-500">
            Action
          </label>
          <label class="flex items-center text-white">
            <input type="checkbox" name="genres" value="Adventure" class="mr-2 accent-pink-500">
            Adventure
          </label>
          <label class="flex items-center text-white">
            <input type="checkbox" name="genres" value="Strategy" class="mr-2 accent-pink-500">
            Strategy
          </label>
          <label class="flex items-center text-white">
            <input type="checkbox" name="genres" value="Sports" class="mr-2 accent-pink-500">
            Sports
          </label>
          <label class="flex items-center text-white">
            <input type="checkbox" name="genres" value="Simulation" class="mr-2 accent-pink-500">
            Simulation
          </label>
          <label class="flex items-center text-white">
            <input type="checkbox" name="genres" value="Sandbox" class="mr-2 accent-pink-500">
            Sandbox
          </label>
          <label class="flex items-center text-white">
            <input type="checkbox" name="genres" value="Party" class="mr-2 accent-pink-500">
            Party
          </label>
          <label class="flex items-center text-white">
            <input type="checkbox" name="genres" value="Shooter" class="mr-2 accent-pink-500">
            Shooter
          </label>
        </div>
      </div>
      <div>
        <label class="block text-white text-sm font-medium mb-2">Preferred Modes:</label>
        <div class="space-y-2">
          <label class="flex items-center text-white">
            <input type="checkbox" name="modes" value="Single-player" class="mr-2 accent-pink-500">
            Single-player
          </label>
          <label class="flex items-center text-white">
            <input type="checkbox" name="modes" value="Multiplayer" class="mr-2 accent-pink-500">
            Multiplayer
          </label>
          <label class="flex items-center text-white">
            <input type="checkbox" name="modes" value="Online" class="mr-2 accent-pink-500">
            Online
          </label>
        </div>
      </div>
      <button type="submit"
              class="w-full bg-gradient-to-r from-pink-500 to-purple-600 text-white py-3 px-4 rounded-lg font-semibold hover:from-pink-600 hover:to-purple-700 transition duration-300 transform hover:scale-105">
        Create Account
      </button>
    </form>
    <p class="text-white text-center mt-6">
      Already have an account? <a href="login.html" class="text-pink-300 hover:text-pink-100 underline">Login here</a>
    </p>
  </div>
  <script src="js/UserForm.js"></script>
</body>
</html>
